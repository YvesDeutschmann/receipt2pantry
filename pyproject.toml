[project]
name = "receipt2pantry"
version = "0.1.0"
description = "Meald - Automated grocery receipt syncing and pantry management"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.0",
    "email-validator>=2.0.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "flask>=3.0.0",
    "flask-cors>=4.0.0",
    "supabase>=2.0.0",
    "requests>=2.31.0",
    "openai>=1.0.0",
    "tenacity>=8.0.0",
    "pdfplumber>=0.10.0",
    "google-generativeai>=0.3.0",
    "pyjwt>=2.8.0",
    "sentry-sdk[flask]>=2.66.1",
    "gunicorn>=23.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parsers"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "live_supabase: hits remote/dev Supabase (opt-in COOK_LOOP_LIVE=1 or HOUSEHOLD_JOIN_LIVE=1)",
]
