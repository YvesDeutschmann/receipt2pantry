# fly.toml app configuration file generated for meald-api on 2026-07-28T15:49:17-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'meald-api'
primary_region = 'sjc'

[build]
[env]
  CORS_ORIGINS = 'capacitor://localhost'
  FEATURE_MEAL_PLANNER = '0'
  FLASK_ENV = 'production'
  LOG_LEVEL = 'INFO'
  SENTRY_ENVIRONMENT = 'production'
  SPOONACULAR_CALL_BUDGET = '250'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
